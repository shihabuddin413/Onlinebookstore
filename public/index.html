<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookstore Inventory</title>
    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            margin: 40px;
            color: #000;
        }
        h1 {
            font-size: 2em;
            margin-bottom: 20px;
        }
        ul {
            list-style-type: disc;
            padding-left: 30px;
        }
        li {
            margin-bottom: 18px;
            font-size: 1.1em;
            line-height: 1.4;
        }
        .book-title {
            font-weight: bold;
        }
        .nav-bar {
            margin-top: 40px;
            padding-top: 15px;
            border-top: 1px solid #ccc;
            font-family: Arial, sans-serif;
            font-size: 0.9em;
            color: #555;
        }
        .nav-bar a {
            color: #0066cc;
            text-decoration: none;
            margin-right: 15px;
        }
        .nav-bar a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1>Bookstore Inventory</h1>
    
    <ul id="inventory-list">Loading inventory from server...</ul>

    <div class="nav-bar">
        <strong>Server Endpoints:</strong>
        <a href="/api/books" target="_blank">JSON Inventory API</a>
        <a href="/api/xml-catalog" target="_blank">XML Catalog</a>
        <a href="/api/schema" target="_blank">XSD Schema</a>
    </div>

    <script>
        /**
         * Asynchronously loads inventory data from the backend server's JSON API.
         * Dynamically generates the HTML list items to match the required visual representation.
         */
        async function loadInventory() {
            const listContainer = document.getElementById('inventory-list');
            try {
                const response = await fetch('/api/books');
                if (!response.ok) {
                    throw new Error(`Server returned HTTP ${response.status}`);
                }
                const data = await response.json();
                
                listContainer.innerHTML = ''; // Clear loading placeholder

                data.books.forEach(book => {
                    const listItem = document.createElement('li');
                    listItem.innerHTML = `
                        <span class="book-title">${book.title}</span><br>
                        Author: ${book.author.firstName} ${book.author.lastName}<br>
                        Publication Year: ${book.publicationYear}<br>
                        Publisher: ${book.details.publisher}<br>
                        Page Count: ${book.details.pageCount}<br>
                        Available: ${book.available ? 'Yes' : 'No'}
                    `;
                    listContainer.appendChild(listItem);
                });
            } catch (error) {
                console.error('Error fetching inventory:', error);
                listContainer.innerHTML = '<li style="color: red;">Error loading inventory from server. Please verify the backend is running.</li>';
            }
        }

        // Initialize loading on DOM ready
        window.addEventListener('DOMContentLoaded', loadInventory);
    </script>
</body>
</html>
